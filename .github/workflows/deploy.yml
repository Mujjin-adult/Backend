name: Deploy to GCP MIG

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [opened, reopened]

jobs:
  notify-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Notify PR Created
        run: |
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          curl -H "Content-Type: application/json" \
               -d "{
                 \"embeds\": [{
                   \"title\": \"🔔 New Pull Request\",
                   \"description\": \"${{ github.event.pull_request.title }}\",
                   \"color\": 10181046,
                   \"fields\": [
                     {
                       \"name\": \"Author\",
                       \"value\": \"[@${{ github.event.pull_request.user.login }}](${{ github.event.pull_request.user.html_url }})\",
                       \"inline\": true
                     },
                     {
                       \"name\": \"Branch\",
                       \"value\": \"\`${{ github.event.pull_request.head.ref }}\` → \`${{ github.event.pull_request.base.ref }}\`\",
                       \"inline\": true
                     },
                     {
                       \"name\": \"Changes\",
                       \"value\": \"+${{ github.event.pull_request.additions }} -${{ github.event.pull_request.deletions }}\",
                       \"inline\": true
                     },
                     {
                       \"name\": \"Review URL\",
                       \"value\": \"[Click here to review](${{ github.event.pull_request.html_url }})\",
                       \"inline\": false
                     }
                   ],
                   \"timestamp\": \"$TIMESTAMP\",
                   \"footer\": {
                     \"text\": \"Pull Request #${{ github.event.pull_request.number }}\"
                   }
                 }]
               }" \
               ${{ secrets.DISCORD_WEBHOOK_URL }}

  build-and-deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      # 배포 시작 알림
      - name: Notify Deployment Start
        run: |
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          curl -H "Content-Type: application/json" \
               -d "{
                 \"embeds\": [{
                   \"title\": \"🚀 Deployment Started\",
                   \"description\": \"New deployment has been triggered\",
                   \"color\": 3447003,
                   \"fields\": [
                     {
                       \"name\": \"Branch\",
                       \"value\": \"\`${{ github.ref_name }}\`\",
                       \"inline\": true
                     },
                     {
                       \"name\": \"Author\",
                       \"value\": \"${{ github.event.head_commit.author.name }}\",
                       \"inline\": true
                     },
                     {
                       \"name\": \"Commit Message\",
                       \"value\": \"${{ github.event.head_commit.message }}\",
                       \"inline\": false
                     }
                   ],
                   \"timestamp\": \"$TIMESTAMP\",
                   \"footer\": {
                     \"text\": \"GitHub Actions\"
                   }
                 }]
               }" \
               ${{ secrets.DISCORD_WEBHOOK_URL }}

      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. GCP 인증
      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v1'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      # 3. Docker 설정
      - name: Docker configuration
        run: |-
          gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev

      # 4. Docker 이미지 빌드 및 푸시
      - name: Build and Push Container
        run: |-
          docker build -t ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REPO }}/${{ secrets.IMAGE_NAME }}:latest .
          docker push ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REPO }}/${{ secrets.IMAGE_NAME }}:latest

      # 배포 전 최대 크기 임시 증가
      - name: Increase Max Size
        run: |-
          gcloud compute instance-groups managed set-autoscaling ${{ secrets.MIG_SPOT_NAME }} \
            --region=${{ secrets.GCP_REGION }} \
            --max-num-replicas=20

      # ondemand 업데이트
      - name: ondemand Update MIG
        run: |-
          gcloud compute instance-groups managed rolling-action replace ${{ secrets.MIG_NAME }} \
            --zone=${{ secrets.GCP_REGION }}-a \
            --max-unavailable=0 \
            --max-surge=1

            
      # 블루그린 업데이트
      - name: bluegreen Update MIG
        run: |-
          gcloud compute instance-groups managed rolling-action replace ${{ secrets.MIG_SPOT_NAME }} \
            --region=${{ secrets.GCP_REGION }} \
            --max-surge=3 \
            --max-unavailable=0

      # 배포 후 최대 크기 원복
      - name: Restore Max Size
        run: |-
          gcloud compute instance-groups managed set-autoscaling ${{ secrets.MIG_SPOT_NAME }} \
            --region=${{ secrets.GCP_REGION }} \
            --max-num-replicas=10

      - name: Notify Deployment Success
        if: success()
        run: |
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          curl -H "Content-Type: application/json" \
               -d "{
                 \"embeds\": [{
                   \"title\": \"✅ Deployment Successful\",
                   \"description\": \"Your application has been deployed successfully!\",
                   \"color\": 3066993,
                   \"fields\": [
                     {
                       \"name\": \"Environment\",
                       \"value\": \"Production\",
                       \"inline\": true
                     },
                     {
                       \"name\": \"Duration\",
                       \"value\": \"~2 minutes\",
                       \"inline\": true
                     },
                     {
                       \"name\": \"Commit\",
                       \"value\": \"[\`${{ github.sha }}\`](${{ github.event.repository.html_url }}/commit/${{ github.sha }})\",
                       \"inline\": false
                     },
                     {
                       \"name\": \"Action Run\",
                       \"value\": \"[View Details](${{ github.event.repository.html_url }}/actions/runs/${{ github.run_id }})\",
                       \"inline\": false
                     }
                   ],
                   \"thumbnail\": {
                     \"url\": \"https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png\"
                   },
                   \"timestamp\": \"$TIMESTAMP\",
                   \"footer\": {
                     \"text\": \"Deployed via GitHub Actions\",
                     \"icon_url\": \"https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png\"
                   }
                 }]
               }" \
               ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Notify Deployment Failure
        if: failure()
        run: |
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          curl -H "Content-Type: application/json" \
               -d "{
                 \"embeds\": [{
                   \"title\": \"❌ Deployment Failed\",
                   \"description\": \"The deployment encountered an error\",
                   \"color\": 15158332,
                   \"fields\": [
                     {
                       \"name\": \"Branch\",
                       \"value\": \"\`${{ github.ref_name }}\`\",
                       \"inline\": true
                     },
                     {
                       \"name\": \"Author\",
                       \"value\": \"${{ github.event.head_commit.author.name }}\",
                       \"inline\": true
                     },
                     {
                       \"name\": \"Error Details\",
                       \"value\": \"[View Logs](${{ github.event.repository.html_url }}/actions/runs/${{ github.run_id }})\",
                       \"inline\": false
                     }
                   ],
                   \"timestamp\": \"$TIMESTAMP\",
                   \"footer\": {
                     \"text\": \"Please check the logs for details\"
                   }
                 }]
               }" \
               ${{ secrets.DISCORD_WEBHOOK_URL }}
